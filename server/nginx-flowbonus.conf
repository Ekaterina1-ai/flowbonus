# FlowBonus — конфиг nginx (reverse proxy на waitress).
# Устанавливается в /etc/nginx/sites-available/flowbonus скриптом deploy.sh.
#
# Пока домена нет, сайт отвечает на любое имя и на IP (server_name _).
# Когда купите домены — впишите их в server_name и запустите server/enable-https.sh,
# certbot сам добавит блок с 443 и редиректом.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Должно совпадать с MAX_UPLOAD_MB в /etc/flowbonus.env.
    client_max_body_size 20M;

    access_log /var/log/nginx/flowbonus-access.log;
    error_log  /var/log/nginx/flowbonus-error.log;

    # Для проверки домена Let's Encrypt (см. enable-https.sh).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:5500;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
